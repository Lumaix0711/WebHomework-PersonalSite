<!DOCTYPE html>
<!--
    info.html —— 基本信息页面

    页面结构：
      1. 跑马灯横幅 —— 与所有页面共用
      2. 导航栏     —— 与所有页面共用（完全相同的代码）
      3. 内容区域   —— 本页面的核心内容（头像 + 信息表格）
      4. 引入 JS    —— 与所有页面共用

    如何修改：
      - 想改表格内容？直接修改 <td> 里的文字
      - 想加更多行？在 <table> 里复制一组 <tr>...</tr>
      - 想换头像？修改 <img src="..."> 的路径
-->
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>基本信息 - 刘孟灏的个人网页</title>
    <!-- 引入外部 CSS，id 用于 JS 切换主题 -->
    <link rel="stylesheet" href="../css/style.css" id="theme-stylesheet">
    <style>
        html { scroll-behavior: smooth; }
    </style>
</head>
<body>

    <!-- 跑马灯横幅（所有页面共用，内容相同） -->
    <div class="marquee-banner">
        <span class="marquee-text">
            欢迎来到刘孟灏的个人主页！&nbsp;&nbsp;★&nbsp;&nbsp;这里是北方工业大学计算机科学与技术专业的一名学生的个人空间&nbsp;&nbsp;★&nbsp;&nbsp;感谢你的访问，祝你今天愉快！&nbsp;&nbsp;★&nbsp;&nbsp;Welcome to my personal website!&nbsp;&nbsp;★&nbsp;&nbsp;

    </div>

    <!-- 导航栏（所有页面共用，代码完全相同）
         想修改菜单内容？需要同步修改所有 20 个 HTML 文件的导航栏 -->

            <button class="dropbtn">学业相关 ▾</button>
            <div class="dropdown-content">

                <a href="skills.html">专业技能</a>
                <a href="projects.html">项目作品</a>
                <a href="awards.html">获奖荣誉</a>
            </div>
        </div>
        <div class="dropdown">
            <button class="dropbtn">兴趣爱好 ▾</button>
            <div class="dropdown-content">
                <a href="hobbies.html">兴趣爱好</a>
                <a href="anime.html">动漫</a>
                <a href="games.html">游戏</a>
                <a href="bucket-list.html">心愿清单</a>

        </div>
        <div class="dropdown">

        </div>
        <div class="dropdown">
            <button class="dropbtn">更多选项 ▾</button>
            <div class="dropdown-content">
                <a href="quotes.html">名言警句</a>
                <a href="tools.html">工具网站</a>
                <div class="dropdown">
                    <button class="dropbtn">社交媒体 ▸</button>

            </div>

    </div>

    <!-- ============================
         以下是本页面的核心内容
         不同页面这里的内容不同
    ============================ -->

    <!-- 二级标题（左侧蓝色竖线装饰，样式在 CSS 的 h2 中定义） -->
    <h2 id="info">基本信息</h2>

    <!-- 头像图片 -->
    <img src="../image/avatar.jpg" alt="我的照片" class="avatar">

    <!-- 信息表格

    <table border="1" width="400">
        <tr>
            <th>姓名</th>
            <td>刘孟灏</td>

    <!-- 引入外部 JS（所有页面共用，提供主题切换、标题跑马灯等功能） -->
    <script src="../js/main.js"></script>
</body>
</html>
